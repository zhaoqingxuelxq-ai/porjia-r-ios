name: Build IPA

# 编译 SwiftUI 原生 App → 手动打包未签名 IPA（TrollStore 直接安装）
# 注：不用 xcodebuild -exportArchive（那需要 teamID），直接用 ditto/zip 把 .app 打成 IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive
        run: |
          xcodebuild -scheme PorjiaR -project PorjiaR.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PorjiaR.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: Pack unsigned IPA (for TrollStore)
        run: |
          set -euo pipefail
          mkdir -p build/ipa/Payload
          ARCHIVE=build/PorjiaR.xcarchive
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          echo "APP=$APP"
          ditto "$APP" "build/ipa/Payload/$(basename "$APP")"
          # 确保模型路由表随包（XcodeGen resource 可能因 excludes 未复制）
          if [ ! -f "build/ipa/Payload/$(basename "$APP")/models-dev-api.json" ]; then
            cp PorjiaR/Resources/models-dev-api.json "build/ipa/Payload/$(basename "$APP")/"
          fi
          # 移除 ad-hoc 签名留下的 CodeSignature（TrollStore 会自己签名）
          rm -rf "build/ipa/Payload/$(basename "$APP")/_CodeSignature"
          # 用 python3 zipfile 打包：自动为 UTF-8 中文名设置标志位（系统 zip 不支持 -UN）
          python3 - <<'PYEOF'
          import os, zipfile
          out = 'build/PorjiaR.ipa'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as z:
              for dp, dn, fs in os.walk('build/ipa/Payload'):
                  for f in fs:
                      full = os.path.join(dp, f)
                      z.write(full, os.path.relpath(full, 'build/ipa'))
          print('packed', out, os.path.getsize(out))
          PYEOF
          ls -la build/*.ipa

      - name: Verify
        run: unzip -t build/PorjiaR.ipa | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: PorjiaR-IPA
          path: build/PorjiaR.ipa
          retention-days: 90
